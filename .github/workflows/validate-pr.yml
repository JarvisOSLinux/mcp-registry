name: Validate PR

# Blocking PR gate for the registry. Validates registry.json and manifests
# (schema, id/scope/trustStatus/platforms, integrity hashes) and enforces that a server
# cannot be promoted to the `official` tier without a maintainer applying the
# `trust-approved` label. See docs/TRUST-MODEL.md §4 and
# docs/REGISTRY-AUTOMATION.md §"PR gate".
#
# Two checkouts, and the split between them is the security property:
#
#   pr/    the PR's merge ref — the DATA under judgment (registry.json,
#          servers/**), never executed as gate code
#   gate/  the base branch — the CODE that judges: validator and self-tests
#
# The self-tests run first: the validation ones build throwaway registries in
# a temp dir and assert the validator still rejects what it is supposed to
# reject, so a gate that has quietly stopped firing fails here instead of
# passing everything; the job-model one drives the jarvis-shell servers over
# real stdio JSON-RPC (offline, stdlib only) — its logic runs from gate/ but
# JOBS_SELFTEST_TREE points it at pr/, so it exercises the servers the PR
# actually ships.
#
# Because every script executes from gate/, a PR editing the validator and its
# self-tests together changes nothing about how that same PR is judged — the
# edited gate takes effect only after it merges. What this does NOT close: on
# `pull_request` events GitHub runs THIS WORKFLOW FILE from the PR's merge
# ref, so a diff under .github/workflows/ can still change what this job does.
# That residue is exactly what the required review must read (the ruleset pins
# the `validate` check to the Actions app and requires an approving review,
# with stale approvals dismissed on push). Keep the trigger `pull_request`,
# never `pull_request_target`: fork PRs must get a read-only, secretless token.
#
# Embedding drift is reported as a warning, never a failure: vectors need
# Ollama, which only the manual Generate Embeddings workflow has, so failing
# here would block a manifest edit until vectors were regenerated for text that
# has not merged yet. The annotations are the point — see EMBEDDING-SPEC.md.
#
# `labeled`/`unlabeled` are included so the run re-evaluates when a maintainer
# adds or removes the approval label.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head (the tree under judgment)
        uses: actions/checkout@v6
        with:
          path: pr

      - name: Checkout the gate from the base branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.base_ref }}
          path: gate

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Self-test the validation logic
        run: python3 gate/scripts/selftest_platform_format.py

      - name: Self-test the embedding-drift checks
        run: python3 gate/scripts/selftest_embedding_drift.py

      - name: Self-test the threat-level check
        run: python3 gate/scripts/selftest_threat_level.py

      - name: Self-test the jarvis-shell job model
        run: python3 gate/scripts/selftest_jobs.py
        env:
          JOBS_SELFTEST_TREE: ${{ github.workspace }}/pr

      - name: Self-test the trust-boundary checks
        run: python3 gate/scripts/selftest_trust_gate.py

      - name: Validate registry
        working-directory: pr
        run: |
          python3 ../gate/scripts/validate_registry.py \
            --base ../gate/registry.json \
            ${{ contains(github.event.pull_request.labels.*.name, 'trust-approved') && '--approval-label-present' || '' }}
