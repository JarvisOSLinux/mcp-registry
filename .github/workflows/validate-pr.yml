name: Validate PR

# Blocking PR gate for the registry. Validates registry.json and manifests
# (schema, id/scope/trustStatus/platforms, integrity hashes) and enforces that a server
# cannot be promoted to the `official` tier without a maintainer applying the
# `trust-approved` label. See docs/TRUST-MODEL.md §4 and
# docs/REGISTRY-AUTOMATION.md §"PR gate".
#
# The self-tests run first: the validation ones build throwaway registries in
# a temp dir and assert the validator still rejects what it is supposed to
# reject, so a gate that has quietly stopped firing fails here instead of
# passing everything; the job-model one drives the jarvis-shell servers over
# real stdio JSON-RPC (offline, stdlib only) so a PR cannot silently break the
# run_job / send_input loop or the two servers' byte-identity.
#
# Note what these self-tests can and cannot do. They catch a gate that stopped
# firing by accident — a refactor, a bad merge. They do not stop a PR that edits
# the validator and its self-tests together, because this job runs both from the
# PR's own head. The control for that is branch protection: a required check
# plus a required review, so a diff touching scripts/ or .github/ is read by
# someone other than its author. Without that ruleset every rule below is
# advisory.
#
# Embedding drift is reported as a warning, never a failure: vectors need
# Ollama, which only the manual Generate Embeddings workflow has, so failing
# here would block a manifest edit until vectors were regenerated for text that
# has not merged yet. The annotations are the point — see EMBEDDING-SPEC.md.
#
# `labeled`/`unlabeled` are included so the run re-evaluates when a maintainer
# adds or removes the approval label.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Self-test the validation logic
        run: python3 scripts/selftest_platform_format.py

      - name: Self-test the embedding-drift checks
        run: python3 scripts/selftest_embedding_drift.py

      - name: Self-test the threat-level check
        run: python3 scripts/selftest_threat_level.py

      - name: Self-test the jarvis-shell job model
        run: python3 scripts/selftest_jobs.py

      - name: Self-test the trust-boundary checks
        run: python3 scripts/selftest_trust_gate.py

      - name: Fetch base registry.json
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          git show "FETCH_HEAD:registry.json" > /tmp/base_registry.json \
            || echo '{}' > /tmp/base_registry.json

      - name: Validate registry
        run: |
          python3 scripts/validate_registry.py \
            --base /tmp/base_registry.json \
            ${{ contains(github.event.pull_request.labels.*.name, 'trust-approved') && '--approval-label-present' || '' }}
