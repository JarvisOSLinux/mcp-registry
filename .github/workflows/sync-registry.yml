name: Sync Registry

# Runs when manifests or setup scripts change on main, or on manual dispatch.
# Recomputes integrity hashes and syncs descriptive fields, then opens a PR
# with the diff rather than pushing directly to main.
#
# Permission requirement: either
#   a) Repo Settings > Actions > General > "Allow GitHub Actions to create and
#      approve pull requests" must be enabled, OR
#   b) A WORKFLOW_TOKEN secret (PAT with repo+workflow scopes) must be set.
#
# Auto-merge: enable "Allow auto-merge" in Settings > General > Pull Requests
# to have these PRs merge themselves immediately (no required checks needed).

on:
  push:
    branches: [main]
    paths:
      - 'servers/*/manifest.json'
      - 'servers/*/setup.sh'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync derived fields
        run: python3 scripts/sync_registry.py

      - name: Open PR if anything changed
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.WORKFLOW_TOKEN || github.token }}
          commit-message: 'chore: sync registry.json derived fields'
          title: 'chore: sync registry.json (automated)'
          body: |
            Automated update triggered by a change to one or more server manifests or setup scripts.

            Changes applied:
            - Recomputed `integrity.manifestSha256` and `integrity.setupScriptSha256`
            - Synced `name`, `summary`, `keywords` from manifests into `registry.json`
            - Updated top-level `updated` timestamp

            Review the diff and merge when ready.
          branch: auto/sync-registry
          delete-branch: true
          labels: automated
          auto-merge: merge
