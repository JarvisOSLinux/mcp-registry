[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-exit"
version = "1.0.0"
description = "Controlled success/failure MCP server for testing dispatch signal paths"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["mcp", "test", "exit", "dispatch"]
dependencies = [
    # mcp 2 removed mcp.server.fastmcp, which this server imports.
    "mcp>=1.2.0,<2",
]

[project.scripts]
mcp-exit = "mcp_exit.server:main"
